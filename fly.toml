# fly.toml app configuration file generated for lighthouse-aah on 2026-11-10T08:08:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
# Never put AAH_WEBHOOK_URL or other secrets in this file; use `fly secrets`.
#

app = 'lighthouse-aah'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  AAH_DATABASE_URL = 'sqlite+aiosqlite:////data/aah.db'
  AAH_HOST = '0.0.0.0'
  AAH_PORT = '8080'

[[mounts]]
  source = 'aah_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
