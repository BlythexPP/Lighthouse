[project]
name = "aah"
version = "1.0.0"
description = "Agent Relay Service (ARS) — open HTTP relay for autonomous agents"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Lighthouse" }]

[project.scripts]
aah = "aah.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
